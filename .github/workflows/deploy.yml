name: Verify and deploy portfolio

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      site_url: ${{ steps.site.outputs.site_url }}
      base_path: ${{ steps.site.outputs.base_path }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Choose site URL and base path
        id: site
        shell: bash
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          BASE_PATH: ${{ vars.BASE_PATH }}
        run: |
          owner_site="https://${GITHUB_REPOSITORY_OWNER}.github.io"
          repository_name="${GITHUB_REPOSITORY#*/}"
          site_url="${SITE_URL:-$owner_site}"
          site_url="${site_url%/}"

          if [[ -n "${BASE_PATH:-}" ]]; then
            base_path="$BASE_PATH"
          elif [[ "$site_url" != "$owner_site" || "$repository_name" == "${GITHUB_REPOSITORY_OWNER}.github.io" ]]; then
            base_path="/"
          else
            base_path="/$repository_name"
          fi

          if [[ "$base_path" == "/" ]]; then
            base_path="/"
          else
            base_path="/${base_path#/}"
            base_path="${base_path%/}/"
          fi

          echo "site_url=$site_url" >> "$GITHUB_OUTPUT"
          echo "base_path=$base_path" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify portfolio
        run: npm run verify
        env:
          SITE_URL: ${{ steps.site.outputs.site_url }}
          BASE_PATH: ${{ steps.site.outputs.base_path }}
          PUBLIC_GITHUB_URL: ${{ vars.PUBLIC_GITHUB_URL }}
          PUBLIC_WECHAT_ID: ${{ vars.PUBLIC_WECHAT_ID }}
          PUBLIC_WECHAT_URL: ${{ vars.PUBLIC_WECHAT_URL }}

      - name: Preserve verified site output
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-dist
          path: dist
          retention-days: 1

  deploy:
    if: github.event_name == 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Set up GitHub Pages
        uses: actions/configure-pages@v6

      - name: Download verified site output
        uses: actions/download-artifact@v4
        with:
          name: portfolio-dist
          path: dist

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

name: Build and deploy portfolio

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    # GitHub's workflow syntax cannot use a repository context in push.branches,
    # so the job is gated to the repository's default branch here.
    if: github.event_name == 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Choose site URL and base path
        id: site
        shell: bash
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          BASE_PATH: ${{ vars.BASE_PATH }}
        run: |
          owner_site="https://${GITHUB_REPOSITORY_OWNER}.github.io"
          repository_name="${GITHUB_REPOSITORY#*/}"
          site_url="${SITE_URL:-$owner_site}"
          site_url="${site_url%/}"

          if [[ -n "${BASE_PATH:-}" ]]; then
            base_path="$BASE_PATH"
          elif [[ "$site_url" != "$owner_site" || "$repository_name" == "${GITHUB_REPOSITORY_OWNER}.github.io" ]]; then
            base_path="/"
          else
            base_path="/$repository_name"
          fi

          if [[ "$base_path" == "/" ]]; then
            base_path="/"
          else
            base_path="/${base_path#/}"
            base_path="${base_path%/}/"
          fi

          echo "site_url=$site_url" >> "$GITHUB_OUTPUT"
          echo "base_path=$base_path" >> "$GITHUB_OUTPUT"

      - name: Set up GitHub Pages
        uses: actions/configure-pages@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Type-check Astro project
        run: npm run check
        env:
          SITE_URL: ${{ steps.site.outputs.site_url }}
          BASE_PATH: ${{ steps.site.outputs.base_path }}
          PUBLIC_FORM_ENDPOINT: ${{ vars.PUBLIC_FORM_ENDPOINT }}

      - name: Build and check placeholders
        run: |
          npm run build
          npm run check:placeholders
        env:
          SITE_URL: ${{ steps.site.outputs.site_url }}
          BASE_PATH: ${{ steps.site.outputs.base_path }}
          PUBLIC_FORM_ENDPOINT: ${{ vars.PUBLIC_FORM_ENDPOINT }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
